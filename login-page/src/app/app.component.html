<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" [(opened)]="isSidenavOpen">
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" (click)="sidenav.close()">Dashboard</a>
        <a mat-list-item routerLink="/taskaction/task" (click)="sidenav.close()">Task List</a>
        <a mat-list-item routerLink="/taskaction/gettask" (click)="sidenav.close()">Get Task</a>
        <a mat-list-item routerLink="/taskaction/update" (click)="sidenav.close()">Update Task</a>
        <a mat-list-item routerLink="/taskaction/deletask" (click)="sidenav.close()">Delete Task</a>
      </mat-nav-list>
    </mat-sidenav>
  
    <mat-sidenav-content>
      <!-- <app-toolbar></app-toolbar> Toolbar should always be visible -->
      <router-outlet></router-outlet> <!-- Routed content should be displayed here -->
    </mat-sidenav-content>
  </mat-sidenav-container>
